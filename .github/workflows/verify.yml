name: Verify

on:
  pull_request:
  push:
    branches: [main, Dev_sentryV2]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fohboh_sentry_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fohboh_sentry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fohboh_sentry_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fohboh_sentry_test
      DB_SSLMODE: disable
      SENTRY_SESSION_SECRET: ci-test-session-secret
      E2E_MANAGER_EMAIL: e2e-superadmin@fohboh.test
      E2E_MANAGER_PASSWORD: E2eFohBohTestOnly!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm seed:test
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
