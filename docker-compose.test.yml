services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fohboh_sentry_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fohboh_sentry_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
